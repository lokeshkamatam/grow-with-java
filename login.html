<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Grow With Java</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f8f8fa;
        }

        .login-box {
            width: 390px;
            max-width: 92%;
            background: white;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid #e8e8ec;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            text-align: center;
        }

        .logo {
            width: 55px;
            height: 55px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: #15151a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .google-login {
            display: flex;
            justify-content: center;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #777;
            font-size: 13px;
            text-decoration: none;
        }

        .back:hover {
            color: #e63969;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            GWJ
        </div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Sign in to Grow With Java
        </p>

        <div id="g_id_onload"
             data-client_id="406162008014-mjq17ioemsjeq35pmbp534t5o81b8bgl.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="google-login">
            <div class="g_id_signin"
                 data-type="standard"
                 data-size="large"
                 data-theme="outline"
                 data-text="signin_with"
                 data-shape="rectangular"
                 data-logo_alignment="left">
            </div>
        </div>

        <a href="index.html" class="back">
            ← Back to Grow With Java
        </a>

    </div>

    <script>
        function handleCredentialResponse(response) {

            console.log("Google Login Successful");

            // Save Google credential temporarily
            localStorage.setItem(
                "googleCredential",
                response.credential
            );

            // Redirect to homepage
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
